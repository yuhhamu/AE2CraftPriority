plugins {
    // バージョンはsettings.gradleのpluginManagement.pluginsで一括宣言済み(重複指定するとエラーになる)。
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version

    parchment {
        minecraftVersion = project.'neoForge.parchment.minecraftVersion'
        mappingsVersion  = project.'neoForge.parchment.mappingsVersion'
    }

    mods {
        ae2craftpriority {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            gameDirectory = project.file('run')
        }

        // client run(project.file('run'))とは別ディレクトリにする。
        // 専用サーバーテストではclientと同時に起動するため、world/logs/mods等を共有すると競合する。
        server {
            server()
            gameDirectory = project.file('run/server')
        }

        data {
            data()
            gameDirectory = project.file('run')
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// リポジトリはここでは宣言しない(settings.gradleのdependencyResolutionManagementに一元化)。
// build.gradle側にrepositories{}を書くと、Gradleのデフォルト解決モード(PREFER_PROJECT)により
// settings.gradle側の宣言(NeoForged公式mavenを含む)が丸ごと無視されてしまい、
// neoform-runtime等NeoForge本体が要求する成果物が解決できなくなる
// (2026-07-22ビルド確認、AE2自身のbuild.gradleにもrepositories{}が無いことで裏付け済み)。

dependencies {
    implementation "maven.modrinth:ae2:${ae2_version}"

    // AdvancedAE対応(任意依存): コンパイル時にクラス参照を解決するためだけに必要。
    // ランタイムでは同梱しない(neoforge.mods.tomlでtype="OPTIONAL"の依存として宣言)。
    compileOnly "maven.modrinth:advancedae:${advancedae_version}"
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version, neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

