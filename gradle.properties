## Environment Properties
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Mod Properties
minecraft_version=1.20.1
fabric_loader_version=0.19.3
## AE2 15.4.10 [FABRIC] (tag fabric/v15.4.10) が実際にビルドで使用しているバージョンに
## 合わせている(AE2自身のgradle.propertiesのfabric_version値。GitHub:
## AppliedEnergistics/Applied-Energistics-2 tag fabric/v15.4.10 参照)。
## これより新しいFabric APIだとAEItems初期化時にNoSuchMethodError
## (FabricItemSettings関連)でサーバー起動がクラッシュすることを実機確認済み。
fabric_api_version=0.88.1+1.20.1

mod_id=ae2craftpriority
mod_name=AE2 Crafting Priority
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.yuuhamu.ae2craftpriority
mod_authors=yuuhamu

## AE2 (Applied Energistics 2) dependency (Fabric)
## Modrinth上の表示バージョン番号"15.4.10"はForge版と共用されているため、Modrinth Maven上での
## 一意特定のためバージョン番号ではなく個別のバージョンID(kA3rm9EP)を直接指定する。
## https://modrinth.com/mod/ae2/version/kA3rm9EP ("AE2 15.4.10 [FABRIC]"、2026-08-11時点で確認)
ae2_fabric_version_id=kA3rm9EP
