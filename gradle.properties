## Environment Properties
## 暫定調整(2026-07-27): decompileステップ(Vineflower)がコンテナ内で-Xmx4Gの別プロセスとして
## 起動される(NeoFormRuntimeのハードコード値、ModDevGradleのDSLに変更用オプションは無いことを
## 公式ドキュメント(docs.neoforged.net/toolchain/docs/plugins/mdg/)で確認済み)。Gradleデーモン側の
## ヒープを絞り、コンテナ全体としての空きメモリに余裕を持たせる。
## 2026-07-29追記: :downloadAssetsが「見せかけのUP-TO-DATE」判定を返す事象の対処として、
## 既存Gradleデーモンが古い状態をメモリ上に保持し続けている疑いがあるため、jvmargsの文字列を
## 意図的に変更し新規デーモン起動を強制する(-Dで実害の無いダミープロパティを追加するだけ)。
## デーモン再起動により.gradle/8.14.2/executionHistory削除(同日実施)が正しく反映されるか検証中。
## 2026-08-06追記: コンテナ側の共有Gradleキャッシュ(/app/.gradle/caches/neoformruntime/)自体が
## 丸ごと消失していたにもかかわらず、このプロジェクトの実行履歴(.gradle/8.14.2/executionHistory)は
## :downloadAssets等をUP-TO-DATEのまま返し続けていたため、joptsimple.ValueConversionException
## (存在しないassetsDirを指すパスを解決しようとして失敗)でCLIENT起動が継続的に失敗していた。
## 実行履歴ディレクトリを退避(削除ではなくリネーム、device bridgeの制約のため)+ 本フラグの値変更で
## 新規デーモン起動を強制し、NeoFormRuntimeの再ダウンロード・再デコンパイルにより解消した
## (フルデコンパイルのため約23分要した)。
org.gradle.jvmargs=-Xmx1G -Dnfrt.forcenewdaemon.20260806=1
org.gradle.parallel=false

## Java toolchain auto-detection(固定パス配置のJDKをGradleに認識させる。Z:\Claude\CLAUDE.md 2章準拠)
org.gradle.java.installations.paths=Z:/Claude/Tools/Java/jdk-17,Z:/Claude/Tools/Java/jdk-21
org.gradle.java.installations.auto-detect=true
## 暫定回避策(2026-07-27、settings.gradle参照): mc-moddevビルドコンテナからZ:\Claude\Tools\Javaが
## 到達不能なため、コンテナ内限定でGradle自身にJDK21を取得させる。マウント修正後はfalseへ戻すこと。
org.gradle.java.installations.auto-download=true

